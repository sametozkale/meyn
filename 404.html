<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./Group 2.svg" />
  <link rel="alternate icon" href="./Group 2.svg" />
  <link rel="apple-touch-icon" href="./Group 2.svg" />
  
  <!-- Performance: Preconnect to external resources -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
  
  <!-- SEO: Primary Meta Tags -->
  <title>404 - Page Not Found | Meyn AI</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Meyn AI homepage." />
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Performance: Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#00B5E9",
            textMuted: "#BBBCC3",
          },
          fontFamily: {
            open: ['"Open Runde"', "Inter", "system-ui", "-apple-system", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    @font-face {
      font-family: "Open Runde";
      src: local("Open Runde"), local("OpenRunde");
      font-weight: 400;
      font-style: normal;
    }
    
    body {
      font-family: "Open Runde", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    
    /* Mobile Safari font rendering fixes */
    @supports (-webkit-touch-callout: none) {
      body {
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      
      h1, h2, h3, h4, h5, h6, p, span, a, button {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFFFF] flex flex-col items-center justify-center font-open text-textMuted px-4 sm:px-6">
  <div class="flex flex-col items-center gap-6 text-center max-w-[640px]">
    <div class="w-24 h-24 sm:w-32 sm:h-32 flex items-center justify-center">
      <img src="./Group 2.svg" alt="Meyn AI Logo" class="w-full h-full object-contain opacity-20" />
    </div>
    
    <h1 class="text-4xl sm:text-5xl md:text-6xl font-medium text-[#181925] font-open">
      404
    </h1>
    
    <h2 class="text-xl sm:text-2xl md:text-3xl font-medium text-[#181925] font-open">
      Page Not Found
    </h2>
    
    <p class="text-base sm:text-lg text-[#777] font-open leading-relaxed">
      The page you're looking for doesn't exist or has been moved.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4 mt-4">
      <a 
        href="/" 
        class="inline-flex items-center justify-center gap-2 text-sm sm:text-base font-medium transition-colors duration-200 rounded-[999px] text-white bg-primary hover:bg-[#0099CC] py-3 px-6 font-open shadow-[0_1px_1px_0_rgba(0,0,0,0.08),0_0_0_1px_rgba(0,0,0,0.05)]"
      >
        Go to Homepage
      </a>
      <a 
        href="/manifesto.html" 
        class="inline-flex items-center justify-center gap-2 text-sm sm:text-base font-medium transition-colors duration-200 rounded-[999px] text-[#666] bg-[#F7F7F7] hover:bg-[#EDEDED] py-3 px-6 font-open"
      >
        View Manifesto
      </a>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="absolute bottom-0 left-0 right-0 mb-6 sm:mb-8 w-full px-4 sm:px-6">
    <div class="flex justify-center">
      <p class="text-center text-xs text-[#999] font-open">
        Made with ☕️ by <a href="https://www.samet.works/" target="_blank" rel="noopener noreferrer" class="text-[#00B5E9] hover:text-[#0099CC] transition-colors">Samet</a>
      </p>
    </div>
  </footer>
</body>
</html>
